<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedPass | Patient Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --green:#2DC98E;--teal:#14B8A6;--blue:#3B82F6;--purple:#8B5CF6;
      --red:#EF4444;--orange:#F97316;--pink:#EC4899;
      --text:#1a1a2e;--muted:#6B7280;--border:#E5E7EB;--white:#FFFFFF;
    }
    html{scroll-behavior:smooth;}
    body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#F0F7F4 0%,#F5F3FF 100%);min-height:100vh;display:flex;flex-direction:column;}

    /* ── Navbar ── */
    .navbar{background:#fff;padding:16px 40px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:12px;}
    .nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:20px;font-weight:700;}
    .nav-brand-icon{width:32px;height:32px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;}
    .nav-brand-text{color:var(--teal);letter-spacing:-.5px;}
    .nav-brand-sub{font-size:11px;color:var(--muted);font-weight:400;display:block;}
    .nav-right{display:flex;align-items:center;gap:16px;}
    .nav-link{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--text);font-weight:500;font-size:14px;transition:color .2s;}
    .nav-link:hover{color:var(--teal);}
    .nav-link svg{width:18px;height:18px;}
    .btn-logout{display:flex;align-items:center;gap:6px;padding:8px 16px;background:#FEF2F2;color:#DC2626;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s;}
    .btn-logout:hover{background:#FEE2E2;}

    /* ── Layout ── */
    .container{max-width:1000px;width:100%;margin:0 auto;padding:40px 20px;flex:1;}

    /* ── Page header ── */
    .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
    .dashboard-title{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;padding:10px 22px;border-radius:10px;font-size:18px;font-weight:700;}

    /* ── Welcome card ── */
    .welcome-card{background:linear-gradient(135deg,rgba(236,72,153,.06),rgba(139,92,246,.06));border:1px solid rgba(139,92,246,.12);border-radius:16px;padding:24px 28px;margin-bottom:32px;}
    .welcome-card h2{font-size:22px;font-weight:700;color:var(--text);}
    .welcome-card .meta{font-size:13px;color:var(--muted);margin-top:6px;}
    .welcome-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
    .welcome-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;}
    .badge-blue{background:rgba(59,130,246,.1);color:var(--blue);}
    .badge-green{background:rgba(45,201,142,.1);color:var(--green);}
    .badge-purple{background:rgba(139,92,246,.1);color:var(--purple);}

    /* ── Tabs ── */
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px;background:#fff;padding:6px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
    .tab-btn{flex:1;min-width:120px;padding:10px 14px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--muted);background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;}
    .tab-btn.active{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;box-shadow:0 4px 12px rgba(139,92,246,.3);}
    .tab-btn:hover:not(.active){background:#f3f4f6;color:var(--text);}
    .tab-count{background:rgba(255,255,255,.3);padding:1px 6px;border-radius:10px;font-size:11px;}
    .tab-btn:not(.active) .tab-count{background:rgba(139,92,246,.1);color:var(--purple);}

    /* ── Tab panels ── */
    .tab-panel{display:none;}
    .tab-panel.active{display:block;}

    /* ── Section label ── */
    .section-label{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--text);margin-bottom:14px;margin-top:4px;}

    /* ── Record cards ── */
    .record-card{background:#fff;border-radius:14px;padding:20px 22px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid var(--border);display:flex;align-items:flex-start;gap:16px;transition:box-shadow .2s;}
    .record-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.09);}
    .record-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;}
    .record-body{flex:1;}
    .record-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px;}
    .record-sub{font-size:12px;color:var(--muted);margin-bottom:10px;}
    .record-meta{display:flex;gap:32px;flex-wrap:wrap;}
    .meta-item label{font-size:11px;color:var(--muted);display:block;margin-bottom:2px;}
    .meta-item span{font-size:13px;font-weight:600;color:var(--text);}
    .meta-item span.normal{color:#16A34A;}
    .meta-item span.abnormal{color:var(--red);}
    .meta-item span.pending{color:var(--orange);}

    /* ── Status badges ── */
    .status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
    .pill-pending{background:#FEF3C7;color:#92400E;}
    .pill-approved{background:#D1FAE5;color:#065F46;}
    .pill-completed{background:#DBEAFE;color:#1E40AF;}
    .pill-rejected{background:#FEE2E2;color:#991B1B;}

    /* ── PDF buttons ── */
    .pdf-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
    .pdf-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;transition:all .2s;border:none;cursor:pointer;}
    .pdf-btn-view{background:linear-gradient(90deg,var(--blue),var(--purple));color:#fff;}
    .pdf-btn-view:hover{opacity:.88;}
    .pdf-btn-dl{background:#F3F4F6;color:#374151;border:1px solid var(--border);}
    .pdf-btn-dl:hover{background:#E5E7EB;}

    /* ── Request cards ── */
    .req-card{background:#fff;border-radius:14px;padding:20px 22px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);border-left:4px solid var(--border);}
    .req-card.pharmacy{border-left-color:var(--green);}
    .req-card.radiology{border-left-color:var(--purple);}
    .req-card.bloodtest{border-left-color:var(--red);}
    .req-card.doctor{border-left-color:var(--blue);}
    .req-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
    .req-title{font-size:15px;font-weight:700;color:var(--text);}
    .req-meta{display:flex;gap:24px;flex-wrap:wrap;font-size:13px;color:var(--muted);}
    .req-meta span b{color:var(--text);font-weight:600;}

    /* ── Empty / loader ── */
    .empty-state{background:#fff;border-radius:16px;padding:40px;text-align:center;color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.04);}
    .empty-state .empty-icon{font-size:40px;margin-bottom:12px;}
    .empty-state p{font-size:14px;}
    .loader{text-align:center;padding:40px;color:var(--teal);font-weight:500;}

    /* ── Toast ── */
    .toast{position:fixed;bottom:28px;right:28px;background:#1a1a2e;color:#fff;padding:14px 20px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.2);z-index:999;display:flex;align-items:center;gap:10px;transform:translateY(80px);opacity:0;transition:all .4s;min-width:260px;}
    .toast.show{transform:translateY(0);opacity:1;}
    .toast.success{border-left:4px solid var(--green);}
    .toast.error{border-left:4px solid var(--red);}

    footer{background:#1a1a2e;color:#fff;padding:32px 20px;text-align:center;margin-top:auto;}
    footer p{font-size:13px;color:rgba(255,255,255,.5);}

    @media(max-width:700px){
      .navbar{padding:16px 20px;}
      .container{padding:24px 16px;}
      .tabs{flex-direction:column;}
      .tab-btn{min-width:unset;}
      .record-card{flex-direction:column;}
      .record-meta,.req-meta{flex-direction:column;gap:8px;}
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="#" class="nav-brand">
    <div class="nav-brand-icon">💚</div>
    <div><div class="nav-brand-text">MedPass</div><span class="nav-brand-sub">Patient Portal</span></div>
  </a>
  <div class="nav-right">
    <a href="home_page.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <button class="btn-logout" onclick="handleLogout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Logout
    </button>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <div class="dashboard-title">🏥 Patient Dashboard</div>
  </div>
  <div id="welcomeArea"></div>
  <div id="tabsArea" style="display:none;">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('all')" id="tab-all">
        🗂️ Show All <span class="tab-count" id="cnt-all">0</span>
      </button>
      <button class="tab-btn" onclick="switchTab('medical')" id="tab-medical">
        📋 Medical Records <span class="tab-count" id="cnt-medical">0</span>
      </button>
      <button class="tab-btn" onclick="switchTab('blood')" id="tab-blood">
        🩸 Blood Tests <span class="tab-count" id="cnt-blood">0</span>
      </button>
      <button class="tab-btn" onclick="switchTab('radiology')" id="tab-radiology">
        🩻 Radiology <span class="tab-count" id="cnt-radiology">0</span>
      </button>
      <button class="tab-btn" onclick="switchTab('prescriptions')" id="tab-prescriptions">
        💊 Prescriptions <span class="tab-count" id="cnt-prescriptions">0</span>
      </button>
      <button class="tab-btn" onclick="switchTab('requests')" id="tab-requests">
        📨 Requests <span class="tab-count" id="cnt-requests">0</span>
      </button>
    </div>

    <!-- Show All -->
    <div class="tab-panel active" id="panel-all">
      <div id="all-content"><div class="loader">Loading…</div></div>
    </div>

    <!-- Medical Records -->
    <div class="tab-panel" id="panel-medical">
      <div id="medical-content"><div class="loader">Loading…</div></div>
    </div>

    <!-- Blood Tests -->
    <div class="tab-panel" id="panel-blood">
      <div id="blood-content"><div class="loader">Loading…</div></div>
    </div>

    <!-- Radiology -->
    <div class="tab-panel" id="panel-radiology">
      <div id="radiology-content"><div class="loader">Loading…</div></div>
    </div>

    <!-- Prescriptions (pharmacyRequests) -->
    <div class="tab-panel" id="panel-prescriptions">
      <div id="prescriptions-content"><div class="loader">Loading…</div></div>
    </div>

    <!-- All doctor requests -->
    <div class="tab-panel" id="panel-requests">
      <div id="requests-content"><div class="loader">Loading…</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<footer><p>© 2026 MedPass — Secure Health Data</p></footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC8Q0_KTrSHYjQxLUJYtst1NU4g-V8tz8s",
  authDomain: "med1-1931d.firebaseapp.com",
  projectId: "med1-1931d",
  storageBucket: "med1-1931d.firebasestorage.app",
  messagingSenderId: "358197809853",
  appId: "1:358197809853:web:9462e23af83a83b1deddd4"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

let currentUser    = null;
let currentProfile = null;

document.documentElement.style.visibility = 'hidden';

auth.onAuthStateChanged(async (user) => {
  if (!user) { window.location.replace('login_page.html'); return; }
  try {
    const snap = await db.collection('users').doc(user.uid).get();
    if (!snap.exists) { await auth.signOut(); window.location.replace('login_page.html'); return; }
    const profile = snap.data();
    if (profile.role !== 'Patient' || profile.status === 'inactive') {
      await auth.signOut(); window.location.replace('login_page.html'); return;
    }
    currentUser    = user;
    currentProfile = profile;
    document.documentElement.style.visibility = 'visible';
    renderWelcome(profile);
    await loadAll(user.uid, profile);
  } catch(e) {
    console.error(e);
    window.location.replace('login_page.html');
  }
});

// ── Welcome card ──────────────────────────────────────────────────────────
function renderWelcome(p) {
  document.getElementById('welcomeArea').innerHTML = `
    <div class="welcome-card">
      <h2>Welcome, ${esc(p.name || p.firstName || 'Patient')} 👋</h2>
      <div class="meta">
        Patient ID: <strong>${esc(p.patientId || '—')}</strong> &nbsp;|&nbsp;
        DOB: <strong>${esc(p.dob || '—')}</strong> &nbsp;|&nbsp;
        Blood Type: <strong>${esc(p.bloodType || '—')}</strong>
      </div>
      <div class="welcome-badges">
        <span class="welcome-badge badge-green">✅ Active Account</span>
        <span class="welcome-badge badge-blue">🏥 ${esc(p.hospitalName || 'Registered')}</span>
        ${p.chronicDiseases && p.chronicDiseases !== 'None' ? `<span class="welcome-badge badge-purple">⚕️ ${esc(p.chronicDiseases)}</span>` : ''}
      </div>
    </div>`;
  document.getElementById('tabsArea').style.display = 'block';
}

// ── Load everything in parallel ───────────────────────────────────────────
async function loadAll(uid, profile) {
  await Promise.all([
    loadMedicalRecords(uid, profile),
    loadBloodTests(uid, profile),
    loadRadiology(uid, profile),
    loadPrescriptions(uid),
    loadRequests(uid),
  ]);
  renderShowAll();
}

// ── Show All — mirrors content from each section with a category divider ──
function renderShowAll() {
  const medical      = document.getElementById('medical-content')?.innerHTML     || '';
  const blood        = document.getElementById('blood-content')?.innerHTML       || '';
  const radiology    = document.getElementById('radiology-content')?.innerHTML   || '';
  const prescriptions= document.getElementById('prescriptions-content')?.innerHTML || '';
  const requests     = document.getElementById('requests-content')?.innerHTML    || '';

  const total =
    parseInt(document.getElementById('cnt-medical').textContent  || 0) +
    parseInt(document.getElementById('cnt-blood').textContent    || 0) +
    parseInt(document.getElementById('cnt-radiology').textContent|| 0) +
    parseInt(document.getElementById('cnt-prescriptions').textContent || 0) +
    parseInt(document.getElementById('cnt-requests').textContent || 0);

  setCount('all', total);

  const section = (icon, label, html) => `
    <div style="margin-bottom:32px;">
      <div class="section-label">${icon} ${label}</div>
      ${html}
    </div>`;

  document.getElementById('all-content').innerHTML =
    section('📋', 'Medical Records',  medical)      +
    section('🩸', 'Blood Tests',      blood)        +
    section('🩻', 'Radiology',        radiology)    +
    section('💊', 'Prescriptions',    prescriptions)+
    section('📨', 'Requests',         requests);
}

// ── Tab switching ─────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

function setCount(id, n) {
  document.getElementById('cnt-' + id).textContent = n;
}

// ── PDF helper ────────────────────────────────────────────────────────────
function pdfBtns(url, name) {
  if (!url) return '';
  // Strip fl_attachment — invalid on raw resources
  const clean = url.replace('/upload/fl_attachment/', '/upload/');
  return `
    <div class="pdf-actions">
      <a href="${esc(clean)}" target="_blank" class="pdf-btn pdf-btn-view">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        View PDF
      </a>
      <a href="${esc(clean)}" download="${esc(name || 'document.pdf')}" class="pdf-btn pdf-btn-dl">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </a>
    </div>`;
}

function statusPill(status) {
  const map = {
    pending:   'pill-pending',
    approved:  'pill-approved',
    completed: 'pill-completed',
    rejected:  'pill-rejected',
    active:    'pill-approved',
  };
  const cls = map[(status||'').toLowerCase()] || 'pill-pending';
  const labels = { pending:'⏳ Pending', approved:'✅ Approved', completed:'✅ Completed', rejected:'❌ Rejected', active:'✅ Active' };
  return `<span class="status-pill ${cls}">${labels[(status||'').toLowerCase()] || esc(status) || '⏳ Pending'}</span>`;
}

function fmtDate(val) {
  if (!val) return '—';
  if (val?.toDate) return val.toDate().toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
  return String(val);
}

// ── Medical Records ───────────────────────────────────────────────────────
async function loadMedicalRecords(uid, profile) {
  const el = document.getElementById('medical-content');
  try {
    // Primary source: users doc array (populated at approval time)
    let records = Array.isArray(profile.medicalRecords) ? [...profile.medicalRecords] : [];

    // Secondary: separate medicalRecords collection (added post-approval)
    try {
      const snap = await db.collection('medicalRecords').where('patientId', '==', uid).get();
      snap.forEach(d => {
        // Deduplicate by pdfUrl or doctorName+date
        const data = d.data();
        const isDupe = records.some(r =>
          (r.pdfUrl && r.pdfUrl === data.pdfUrl) ||
          (r.doctorName === data.doctorName && r.date === data.date && r.diagnosis === data.diagnosis)
        );
        if (!isDupe) records.push({ id: d.id, ...data });
      });
    } catch(e) { console.log('medicalRecords collection:', e.message); }

    setCount('medical', records.length);
    if (!records.length) {
      el.innerHTML = emptyState('📋', 'No medical records yet', 'Records will appear here once added by your healthcare providers.');
      return;
    }
    el.innerHTML = records.map(r => `
      <div class="record-card">
        <div class="record-icon" style="background:rgba(59,130,246,.1);">📋</div>
        <div class="record-body">
          <div class="record-title">${esc(r.doctorName || 'Healthcare Provider')}</div>
          <div class="record-sub">${esc(r.specialty || 'General')}</div>
          <div class="record-meta">
            <div class="meta-item"><label>Date</label><span>${esc(fmtDate(r.date))}</span></div>
            <div class="meta-item"><label>Diagnosis</label><span>${esc(r.diagnosis || '—')}</span></div>
            ${r.notes ? `<div class="meta-item"><label>Notes</label><span>${esc(r.notes)}</span></div>` : ''}
          </div>
          ${pdfBtns(r.pdfUrl, r.pdfName)}
        </div>
      </div>`).join('');
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><p>⚠️ ${esc(e.message)}</p></div>`;
  }
}

// ── Blood Tests ───────────────────────────────────────────────────────────
async function loadBloodTests(uid, profile) {
  const el = document.getElementById('blood-content');
  try {
    let records = Array.isArray(profile.bloodTests) ? [...profile.bloodTests] : [];

    try {
      const snap = await db.collection('bloodTests').where('patientId', '==', uid).get();
      snap.forEach(d => {
        const data = d.data();
        const isDupe = records.some(r => r.pdfUrl && r.pdfUrl === data.pdfUrl);
        if (!isDupe) records.push({ id: d.id, ...data });
      });
    } catch(e) { console.log('bloodTests collection:', e.message); }

    setCount('blood', records.length);
    if (!records.length) {
      el.innerHTML = emptyState('🩸', 'No blood test records yet', 'Blood test results will appear here once processed.');
      return;
    }
    el.innerHTML = records.map(r => {
      const res = (r.result || '').toLowerCase();
      const resCls = res.includes('abnormal') || res.includes('high') || res.includes('low') ? 'abnormal' : res === 'pending' ? 'pending' : 'normal';
      return `
        <div class="record-card">
          <div class="record-icon" style="background:rgba(239,68,68,.1);">🩸</div>
          <div class="record-body">
            <div class="record-title">${esc(r.testName || 'Blood Test')}</div>
            <div class="record-sub">${esc(r.labName || r.laboratory || 'Laboratory')}</div>
            <div class="record-meta">
              <div class="meta-item"><label>Date</label><span>${esc(fmtDate(r.date))}</span></div>
              <div class="meta-item"><label>Result</label><span class="${resCls}">${esc(r.result || 'Pending')}</span></div>
              ${r.referenceRange ? `<div class="meta-item"><label>Reference</label><span>${esc(r.referenceRange)}</span></div>` : ''}
            </div>
            ${pdfBtns(r.pdfUrl, r.pdfName)}
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><p>⚠️ ${esc(e.message)}</p></div>`;
  }
}

// ── Radiology ─────────────────────────────────────────────────────────────
async function loadRadiology(uid, profile) {
  const el = document.getElementById('radiology-content');
  try {
    let records = Array.isArray(profile.radiologyReports) ? [...profile.radiologyReports] : [];

    try {
      const snap = await db.collection('radiologyReports').where('patientId', '==', uid).get();
      snap.forEach(d => {
        const data = d.data();
        const isDupe = records.some(r => r.pdfUrl && r.pdfUrl === data.pdfUrl);
        if (!isDupe) records.push({ id: d.id, ...data });
      });
    } catch(e) { console.log('radiologyReports collection:', e.message); }

    setCount('radiology', records.length);
    if (!records.length) {
      el.innerHTML = emptyState('🩻', 'No radiology reports yet', 'Imaging reports will appear here once processed.');
      return;
    }
    el.innerHTML = records.map(r => {
      const finding = (r.finding || '').toLowerCase();
      const findCls = finding.includes('abnormal') || finding.includes('positive') ? 'abnormal' : finding === 'pending' ? 'pending' : 'normal';
      return `
        <div class="record-card">
          <div class="record-icon" style="background:rgba(139,92,246,.1);">🩻</div>
          <div class="record-body">
            <div class="record-title">${esc(r.examType || r.examination || 'Radiology Exam')}</div>
            <div class="record-sub">${esc(r.centerName || r.radiologyCenter || 'Radiology Center')}</div>
            <div class="record-meta">
              <div class="meta-item"><label>Date</label><span>${esc(fmtDate(r.date))}</span></div>
              <div class="meta-item"><label>Finding</label><span class="${findCls}">${esc(r.finding || r.impression || 'Pending')}</span></div>
              ${r.technique ? `<div class="meta-item"><label>Technique</label><span>${esc(r.technique)}</span></div>` : ''}
            </div>
            ${pdfBtns(r.pdfUrl, r.pdfName)}
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><p>⚠️ ${esc(e.message)}</p></div>`;
  }
}

// ── Prescriptions (pharmacyRequests) ─────────────────────────────────────
async function loadPrescriptions(uid) {
  const el = document.getElementById('prescriptions-content');
  try {
    const snap = await db.collection('pharmacyRequests')
      .where('patientId', '==', uid)
      .get();

    const records = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.sentAt?.toMillis?.() || 0) - (a.sentAt?.toMillis?.() || 0));

    setCount('prescriptions', records.length);
    if (!records.length) {
      el.innerHTML = emptyState('💊', 'No prescriptions yet', 'Prescriptions sent by your doctor to the pharmacy will appear here.');
      return;
    }
    el.innerHTML = records.map(r => `
      <div class="req-card pharmacy">
        <div class="req-header">
          <div>
            <div class="req-title">💊 ${esc(r.medicationName || 'Prescription')}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px;">To: ${esc(r.targetName || 'Pharmacy')}</div>
          </div>
          ${statusPill(r.status)}
        </div>
        <div class="req-meta">
          <span>👨‍⚕️ Dr. <b>${esc(r.doctorName || '—')}</b></span>
          <span>📅 <b>${fmtDate(r.sentAt)}</b></span>
          ${r.dosage    ? `<span>💉 Dosage: <b>${esc(r.dosage)}</b></span>` : ''}
          ${r.frequency ? `<span>🔄 <b>${esc(r.frequency)}</b></span>` : ''}
          ${r.duration  ? `<span>⏱ <b>${esc(r.duration)}</b></span>` : ''}
        </div>
        ${r.instructions ? `<div style="margin-top:10px;font-size:13px;color:var(--muted);padding:10px;background:#f9fafb;border-radius:8px;">📝 ${esc(r.instructions)}</div>` : ''}
        ${pdfBtns(r.fileUrl, 'prescription.pdf')}
      </div>`).join('');
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><p>⚠️ ${esc(e.message)}</p></div>`;
  }
}

// ── All Doctor Requests (radiology + blood test + doctor referrals) ───────
async function loadRequests(uid) {
  const el = document.getElementById('requests-content');
  try {
    let allRequests = [];

    // Radiology requests
    try {
      const snap = await db.collection('radiologyRequests').where('patientId', '==', uid).get();
      snap.forEach(d => allRequests.push({ id: d.id, _type: 'radiology', ...d.data() }));
    } catch(e) { console.log('radiologyRequests:', e.message); }

    // Blood test requests
    try {
      const snap = await db.collection('bloodTestRequests').where('patientId', '==', uid).get();
      snap.forEach(d => allRequests.push({ id: d.id, _type: 'bloodtest', ...d.data() }));
    } catch(e) { console.log('bloodTestRequests:', e.message); }

    // Doctor referrals (consultationRequests where this patient is involved)
    try {
      const snap = await db.collection('consultationRequests').where('patientId', '==', uid).get();
      snap.forEach(d => allRequests.push({ id: d.id, _type: 'doctor', ...d.data() }));
    } catch(e) { console.log('consultationRequests:', e.message); }

    // Sort newest first
    allRequests.sort((a, b) => (b.sentAt?.toMillis?.() || 0) - (a.sentAt?.toMillis?.() || 0));

    setCount('requests', allRequests.length);
    if (!allRequests.length) {
      el.innerHTML = emptyState('📨', 'No requests yet', 'Requests sent by your doctor to other specialists will appear here.');
      return;
    }

    el.innerHTML = allRequests.map(r => {
      if (r._type === 'radiology') {
        return `
          <div class="req-card radiology">
            <div class="req-header">
              <div>
                <div class="req-title">🩻 ${esc(r.examinationType || 'Radiology Request')}</div>
                <div style="font-size:12px;color:var(--muted);margin-top:2px;">To: ${esc(r.targetName || 'Radiology Center')}</div>
              </div>
              ${statusPill(r.status)}
            </div>
            <div class="req-meta">
              <span>👨‍⚕️ Dr. <b>${esc(r.doctorName || '—')}</b></span>
              <span>📅 <b>${fmtDate(r.sentAt)}</b></span>
              ${r.bodyPart ? `<span>🫀 Area: <b>${esc(r.bodyPart)}</b></span>` : ''}
            </div>
            ${r.clinicalIndication ? `<div style="margin-top:10px;font-size:13px;color:var(--muted);padding:10px;background:#f9fafb;border-radius:8px;">📝 ${esc(r.clinicalIndication)}</div>` : ''}
            ${pdfBtns(r.fileUrl, 'radiology_request.pdf')}
          </div>`;
      }
      if (r._type === 'bloodtest') {
        const priorityColor = r.priority === 'STAT' ? 'var(--red)' : r.priority === 'Urgent' ? 'var(--orange)' : 'var(--green)';
        return `
          <div class="req-card bloodtest">
            <div class="req-header">
              <div>
                <div class="req-title">🩸 ${esc(r.testType || 'Blood Test Request')}</div>
                <div style="font-size:12px;color:var(--muted);margin-top:2px;">To: ${esc(r.targetName || 'Lab')}</div>
              </div>
              <div style="display:flex;gap:8px;align-items:center;">
                ${r.priority ? `<span style="font-size:11px;font-weight:700;color:${priorityColor};background:${priorityColor}18;padding:3px 10px;border-radius:20px;">${esc(r.priority)}</span>` : ''}
                ${statusPill(r.status)}
              </div>
            </div>
            <div class="req-meta">
              <span>👨‍⚕️ Dr. <b>${esc(r.doctorName || '—')}</b></span>
              <span>📅 <b>${fmtDate(r.sentAt)}</b></span>
            </div>
            ${r.clinicalNotes ? `<div style="margin-top:10px;font-size:13px;color:var(--muted);padding:10px;background:#f9fafb;border-radius:8px;">📝 ${esc(r.clinicalNotes)}</div>` : ''}
            ${pdfBtns(r.fileUrl, 'bloodtest_request.pdf')}
          </div>`;
      }
      if (r._type === 'doctor') {
        return `
          <div class="req-card doctor">
            <div class="req-header">
              <div>
                <div class="req-title">👨‍⚕️ Doctor Referral${r.specialty ? ' — ' + esc(r.specialty) : ''}</div>
                <div style="font-size:12px;color:var(--muted);margin-top:2px;">To: ${esc(r.targetDoctorName || 'Specialist')}</div>
              </div>
              <div style="display:flex;gap:8px;align-items:center;">
                ${r.responded ? `<span class="status-pill pill-completed">✅ Responded</span>` : `<span class="status-pill pill-pending">⏳ Awaiting</span>`}
              </div>
            </div>
            <div class="req-meta">
              <span>👨‍⚕️ From Dr. <b>${esc(r.doctorName || '—')}</b></span>
              <span>📅 <b>${fmtDate(r.sentAt)}</b></span>
            </div>
            ${r.reason ? `<div style="margin-top:10px;font-size:13px;color:var(--muted);padding:10px;background:#f9fafb;border-radius:8px;">📝 Reason: ${esc(r.reason)}</div>` : ''}
            ${r.responded && r.response ? `<div style="margin-top:8px;font-size:13px;color:#065F46;padding:10px;background:#D1FAE5;border-radius:8px;">💬 Response: ${esc(r.response)}</div>` : ''}
            ${pdfBtns(r.fileUrl, 'referral.pdf')}
          </div>`;
      }
      return '';
    }).join('');
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><p>⚠️ ${esc(e.message)}</p></div>`;
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────
function emptyState(icon, title, msg) {
  return `<div class="empty-state"><div class="empty-icon">${icon}</div><strong>${title}</strong><p style="margin-top:8px;">${msg}</p></div>`;
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.className = `toast ${type}`;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function handleLogout() {
  await auth.signOut();
  window.location.replace('login_page.html');
}
